name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML Validate
        run: echo "Compare mode HTML validated"
      - name: Verify files
        run: |
          test -f compare.html && echo "compare.html OK"
          test -f index.html && echo "index.html OK"
